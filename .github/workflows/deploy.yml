name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: ayushkumar143/smartpothole-ai-service

# The secrets context cannot be used directly in job-level `if:`, so a probe
# job exports which repository secrets are configured. Build/deploy jobs then
# skip cleanly (no red X) until the secrets are added under
# Settings -> Secrets and variables -> Actions.
jobs:
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      has_docker: ${{ steps.check.outputs.has_docker }}
      has_vercel: ${{ steps.check.outputs.has_vercel }}
      has_railway: ${{ steps.check.outputs.has_railway }}
    steps:
      - name: Check for configured secrets
        id: check
        env:
          HAS_DOCKER: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
          HAS_VERCEL: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_RAILWAY: ${{ secrets.RAILWAY_TOKEN != '' }}
        run: |
          echo "has_docker=$HAS_DOCKER" >> "$GITHUB_OUTPUT"
          echo "has_vercel=$HAS_VERCEL" >> "$GITHUB_OUTPUT"
          echo "has_railway=$HAS_RAILWAY" >> "$GITHUB_OUTPUT"

  build-and-push-ai-service:
    runs-on: ubuntu-latest
    needs: check-secrets
    if: needs.check-secrets.outputs.has_docker == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for AI Service
        id: meta-ai
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push AI Service
        uses: docker/build-push-action@v5
        with:
          context: ./ai-service
          file: ./ai-service/Dockerfile
          target: production
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-ai.outputs.tags }}
          labels: ${{ steps.meta-ai.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [check-secrets, build-and-push-ai-service]
    if: ${{ needs.check-secrets.outputs.has_vercel == 'true' && github.ref == 'refs/heads/main' }}
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-ai-service:
    runs-on: ubuntu-latest
    needs: [check-secrets, build-and-push-ai-service]
    if: ${{ needs.check-secrets.outputs.has_railway == 'true' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Deploy to Railway
        uses: railwayapp/railway-deploy@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN }}
          service: smartpothole-ai-service
          dockerfile: ai-service/Dockerfile